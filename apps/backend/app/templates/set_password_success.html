<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Set Successfully - Everleap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 480px;
            width: 100%;
            padding: 48px 40px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .logo {
            height: 32px;
            display: block;
            margin: 0 auto 32px;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: scaleIn 0.5s ease-out;
            color: #16a34a;
        }

        .success-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.025em;
        }

        .message {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            background-color: #0f172a;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s;
            border: none;
        }

        .btn:hover {
            background-color: #1e293b;
            transform: translateY(-1px);
        }

        .redirect-notice {
            margin-top: 24px;
            color: #94a3b8;
            font-size: 14px;
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/static/Logo.svg" alt="Everleap" class="logo">

        <div class="success-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <h1>Password Set Successfully!</h1>
        <p class="message">
            Your account has been activated. You can now log in to Everleap using your email and the password you just
            created.
        </p>

        <a href="https://www.everleap.in/login" class="btn">Go to Login</a>

        <p class="redirect-notice">
            Redirecting to login in <span id="countdown">5</span> seconds...
        </p>

        <div class="footer">
            © 2026 Everleap. All rights reserved.
        </div>
    </div>

    <script>
        // Countdown and auto-redirect
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        const loginUrl = 'https://www.everleap.in/login';

        const countdown = setInterval(function () {
            seconds--;
            countdownElement.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = loginUrl;
            }
        }, 1000);
    </script>
</body>

</html>
