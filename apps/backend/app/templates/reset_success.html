<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful - Everleap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 480px;
            width: 100%;
            padding: 48px 40px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: scaleIn 0.5s ease-out;
            color: #16a34a;
        }

        .success-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            60% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.025em;
        }

        .message {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .user-name {
            color: #0f172a;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            background-color: #0f172a;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #1e293b;
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 13px;
        }

        .logo {
            height: 32px;
            margin-bottom: 24px;
            display: inline-block;
        }

        .security-note {
            background: #eff6ff;
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
            font-size: 14px;
            color: #1e40af;
            text-align: left;
            border: 1px solid #dbeafe;
        }

        .security-note strong {
            display: block;
            margin-bottom: 4px;
            color: #1e3a8a;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/static/Logo.svg" alt="Everleap" class="logo">

        <div class="success-icon">
            <svg viewBox="0 0 52 52">
                <path d="M14 27l10 10 18-18" />
            </svg>
        </div>

        <h1>Password Reset Successful!</h1>

        <p class="message">
            Hi <span class="user-name">{{ user_name }}</span>,<br><br>
            Your password has been successfully reset. You can now log in with your new password.
        </p>

        <a href="https://www.everleap.in/login" class="btn">Continue to Login</a>

        <div class="security-note">
            <strong>🔒 Security Tip</strong>
            For your security, make sure to use a unique password that you don't use on other websites.
        </div>

        <div class="footer">
            © 2026 Everleap. All rights reserved.
        </div>
    </div>
</body>

</html>
